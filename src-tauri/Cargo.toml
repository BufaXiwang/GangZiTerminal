[package]
name = "gangzi-terminal"
version = "0.1.0"
description = "A 股研究 + 模拟交易学习终端"
authors = ["local"]
edition = "2021"

[lib]
name = "gangzi_terminal"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 壳 + IPC
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Rust ↔ TS 类型同步（spec §技术栈：必须走强类型 wrapper）
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono", "rust_decimal", "serde_json"] }
specta-typescript = "=0.0.9"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
async-trait = "0.1"
futures-util = "0.3"

# HTTP（news / quotes / agent provider 共用）
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"

# 时间
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# 货币 / 高精度数
rust_decimal = { version = "1", features = ["serde-with-str"] }

# 标识与杂项
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1.10"
encoding_rs = "0.8"
thiserror = "2"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# TDX 协议子模块（原独立 crate，已并入 infrastructure/quotes/tdx）
# 需要这两个依赖支持协议层（byteorder 解二进制 / flate2 解 gzip 响应）。
byteorder = "1.5"
flate2 = "1.0"

# === news deps ===
# SHA-256 for stable ID hashing (news-module.md §2; reused by quotes/tushare events)
sha2 = "0.10"
# RSS / Atom feed parsing (news/rss adapter)
feed-rs = "2"
# HTML parsing for article extractor (news/article-extractor adapter)
scraper = "0.20"
ego-tree = "0.6"

# === quotes deps ===
# Quotes BC 复用如下已有依赖（无新增 crate）：
# - reqwest / tokio / async-trait：provider HTTP / async wrapper
# - chrono / chrono-tz：交易时段 / Asia/Shanghai
# - encoding_rs：Sina / Tencent / TDX security_list GBK 解码
# - rust_decimal：Price / Amount / Money
# - byteorder / flate2：TDX 协议层二进制 + gzip
# - sha2：tushare 公司事件 stable id
# - rusqlite / rusqlite_migration：quotes 持久化

# === agent-infra deps ===
# Agent Infra 主要复用已有依赖（reqwest / tokio / serde / chrono / uuid / sha2 / thiserror）。
# Skill 调用走 <use_skill> XML 文本协议，不需要 provider SSE / tool_use 解码；HTTP / SSE
# 接线在后续迭代落地（届时再追加 eventsource-stream）。
base64 = "0.22"                 # PayloadStore image dereference → base64 编码 wire format

