<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GangZi · Agent 调用链调试器（离线）</title>
<!--
  独立离线 debug 工具 —— 不进软件、不连后端。直接读 SQLite 快照（sql.js / WASM）。
  用途：审计 agent 决策链（会话 → run → 消息时间线 → ToolCall 输入/输出/耗时/错误）。

  用法：
    1. 浏览器直接打开本文件（双击即可）。
    2. 选择 app 的 DB 文件：~/Library/Application Support/com.gangzi.terminal/gangzi.db
       （建议先复制一份再选，避免 app 正在写时的锁；只读，不会改原库。）
    3. 左侧选会话 → 右侧看该会话每个 run 的消息链 + ToolCall。

  数据真源（schema 见 src-tauri/src/infrastructure/agent/migrations.rs）：
    agent_messages(message_id, run_id, conversation_id, seq, kind, role, blocks_json, created_at)
    agent_tool_calls(tool_call_id, run_id, name, input_summary_json, output_summary_json,
                     is_error, error_code, started_at, ended_at, duration_ms)
    agent_runs(run_id, mode, trigger_json, parent_run_id, provider, wire_format, model, status,
               started_at, ended_at)

  sql.js 从 CDN 加载（首次需联网）。要 100% 离线：把同版本的 sql-wasm.js + sql-wasm.wasm
  放到本文件同目录，并把下方 CDN_BASE 改成 "./"。
-->
<style>
  :root {
    --bg: #0b1220; --panel: #0f172a; --raised: #131f33; --border: #1e293b;
    --text: #cbd5e1; --dim: #64748b; --accent: #2563eb;
    --user: #60a5fa; --assistant: #34d399; --system: #94a3b8;
    --tool: #fbbf24; --err: #f87171; --run: #a78bfa; --think: #818cf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 14px; margin: 0; color: #e2e8f0; font-weight: 600; }
  header .dim { color: var(--dim); font-size: 12px; }
  button, .tab { padding: 4px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--raised); color: var(--text); cursor: pointer; }
  button:hover, .tab:hover { border-color: #334155; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=file] { font-size: 12px; color: var(--dim); }
  input[type=text], textarea { background: var(--raised); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 12px; }
  main { display: flex; height: calc(100vh - 52px); }
  #convList { width: 300px; overflow: auto; border-right: 1px solid var(--border); padding: 8px; flex-shrink: 0; }
  #detail { flex: 1; overflow: auto; padding: 12px 16px; }
  .conv { padding: 7px 9px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; }
  .conv:hover { background: var(--raised); }
  .conv.sel { background: var(--border); }
  .conv .title { color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .sub { color: var(--dim); font-size: 11px; margin-top: 2px; }
  .runhdr { font-family: ui-monospace, monospace; font-size: 11px; color: var(--run);
    border-bottom: 1px dashed var(--border); padding: 4px 0; margin: 14px 0 8px; position: sticky; top: 0; background: var(--bg); }
  .msg { margin-bottom: 10px; }
  .role { display: inline-block; min-width: 78px; font-weight: 600; }
  .role.user { color: var(--user); } .role.assistant { color: var(--assistant); } .role.system { color: var(--system); }
  .seq { color: var(--dim); font-family: ui-monospace, monospace; font-size: 11px; }
  pre { margin: 3px 0 0 78px; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); }
  pre.think { color: var(--think); opacity: .85; }
  .xml { color: var(--tool); }
  .tc { margin: 5px 0 5px 78px; border: 1px solid var(--border); border-radius: 6px;
    font-family: ui-monospace, monospace; font-size: 11px; }
  .tc.err { border-color: #7f1d1d; }
  .tc .hd { padding: 5px 9px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .tc .nm { color: var(--tool); font-weight: 600; } .tc.err .nm { color: var(--err); }
  .tc .body { padding: 6px 9px; border-top: 1px solid var(--border); display: none; }
  .tc.open .body { display: block; }
  .tc .lbl { color: var(--dim); margin-top: 4px; }
  table.grid { width: 100%; border-collapse: collapse; font-family: ui-monospace, monospace; font-size: 11px; }
  table.grid td, table.grid th { padding: 3px 8px; border-bottom: 1px solid #16202e; text-align: left; vertical-align: top; }
  table.grid th { color: var(--dim); position: sticky; top: 0; background: var(--bg); }
  .badge { padding: 1px 6px; border-radius: 4px; font-size: 10px; }
  .b-completed { color: var(--assistant); } .b-failed, .b-cancelled { color: var(--err); }
  .b-running, .b-queued { color: var(--tool); }
  .empty { padding: 40px; text-align: center; color: var(--dim); }
  .hidden { display: none; }
  #sqlPane { padding: 12px 16px; overflow: auto; }
  code.kbd { background: var(--raised); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<header>
  <h1>🐞 Agent 调用链调试器</h1>
  <input type="file" id="file" accept=".db,.sqlite,.sqlite3" />
  <span class="dim" id="status">选择 gangzi.db 开始</span>
  <span style="flex:1"></span>
  <button class="tab active" data-tab="chain">调用链</button>
  <button class="tab" data-tab="runs">Runs</button>
  <button class="tab" data-tab="sql">SQL</button>
</header>

<main id="chainView">
  <div id="convList"><div class="empty">未加载</div></div>
  <div id="detail"><div class="empty">← 选择左侧一个会话</div></div>
</main>

<div id="runsView" class="hidden" style="height:calc(100vh - 52px);overflow:auto;padding:12px 16px">
  <div id="runsBody"><div class="empty">未加载</div></div>
</div>

<div id="sqlView" class="hidden">
  <div id="sqlPane">
    <div class="dim" style="margin-bottom:6px">只读 SQL（仅 SELECT）。例：<code class="kbd">SELECT * FROM agent_tool_calls ORDER BY started_at DESC LIMIT 50</code></div>
    <textarea id="sqlInput" style="width:100%;height:90px" spellcheck="false">SELECT run_id, mode, model, status, started_at FROM agent_runs ORDER BY started_at DESC LIMIT 50</textarea>
    <div style="margin:8px 0"><button id="sqlRun">运行 (Ctrl/Cmd+Enter)</button></div>
    <div id="sqlOut"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
const CDN_BASE = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/";
let db = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// 把 sql.js exec 结果转成行对象数组。
function query(sql, params) {
  if (!db) return [];
  const stmt = db.prepare(sql);
  if (params) stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

function fmtTime(s) {
  if (!s) return "";
  const d = new Date(s);
  return isNaN(d) ? s : d.toLocaleString();
}

// ---------- 加载 DB ----------
$("#file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  $("#status").textContent = "加载 sql.js…";
  try {
    const SQL = await initSqlJs({ locateFile: (file) => CDN_BASE + file });
    const buf = await f.arrayBuffer();
    db = new SQL.Database(new Uint8Array(buf));
    // 探活：表是否存在
    const t = query("SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'agent_%'");
    $("#status").textContent = `已加载 ${f.name} · ${t.length} 张 agent_* 表`;
    renderConversations();
    renderRuns();
  } catch (err) {
    $("#status").textContent = "加载失败：" + err.message;
    console.error(err);
  }
});

// ---------- Tab 切换 ----------
document.querySelectorAll(".tab").forEach((b) =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    const tab = b.dataset.tab;
    $("#chainView").classList.toggle("hidden", tab !== "chain");
    $("#runsView").classList.toggle("hidden", tab !== "runs");
    $("#sqlView").classList.toggle("hidden", tab !== "sql");
  }),
);

// ---------- 调用链：会话列表 ----------
function renderConversations() {
  // 按 conversation_id 聚合；NULL 归一为 "(no-conv)"。
  const rows = query(`
    SELECT COALESCE(conversation_id,'(无会话)') AS cid,
           COUNT(*) AS n, MIN(created_at) AS first_at, MAX(created_at) AS last_at
    FROM agent_messages GROUP BY cid ORDER BY last_at DESC`);
  if (!rows.length) { $("#convList").innerHTML = '<div class="empty">无 agent_messages</div>'; return; }
  const el = $("#convList");
  el.innerHTML = "";
  rows.forEach((r) => {
    // 取该会话第一条 user 消息文本作预览
    const prev = query(
      `SELECT blocks_json FROM agent_messages
       WHERE COALESCE(conversation_id,'(无会话)')=? AND role='user'
       ORDER BY seq IS NULL, seq, created_at LIMIT 1`, [r.cid]);
    let preview = r.cid;
    if (prev[0]) preview = blocksToText(prev[0].blocks_json).slice(0, 50) || r.cid;
    const div = document.createElement("div");
    div.className = "conv";
    div.innerHTML = `<div class="title">${esc(preview)}</div>
      <div class="sub">${r.n} 条 · ${esc(fmtTime(r.last_at))}</div>`;
    div.onclick = () => {
      document.querySelectorAll(".conv").forEach((c) => c.classList.remove("sel"));
      div.classList.add("sel");
      renderConversation(r.cid);
    };
    el.appendChild(div);
  });
}

function blocksToText(json) {
  try {
    return JSON.parse(json).map((b) =>
      b.type === "text" ? b.text : b.type === "thinking" ? "〔thinking〕" + b.text :
      b.type === "image" ? "〔image〕" : "").join(" ");
  } catch { return json; }
}

// 高亮 <use_tool>/<tool_result>/<tool_error> XML
function renderBlockText(text) {
  return esc(text).replace(/(&lt;\/?(?:use_tool|tool_result|tool_error)[^&]*?&gt;)/g,
    '<span class="xml">$1</span>');
}

// ---------- 调用链：选中会话详情 ----------
function renderConversation(cid) {
  const msgs = query(
    `SELECT message_id, run_id, seq, kind, role, blocks_json, created_at
     FROM agent_messages WHERE COALESCE(conversation_id,'(无会话)')=?
     ORDER BY seq IS NULL, seq, created_at`, [cid]);
  const detail = $("#detail");
  if (!msgs.length) { detail.innerHTML = '<div class="empty">空会话</div>'; return; }

  // 预取涉及的 run 的 tool calls
  const runIds = [...new Set(msgs.map((m) => m.run_id).filter(Boolean))];
  const tcByRun = {};
  runIds.forEach((rid) => {
    tcByRun[rid] = query(
      `SELECT tool_call_id, name, input_summary_json, output_summary_json, is_error, error_code, duration_ms
       FROM agent_tool_calls WHERE run_id=? ORDER BY started_at`, [rid]);
  });

  let html = "";
  let curRun = "\0";
  msgs.forEach((m) => {
    const rid = m.run_id || "(无 run)";
    if (rid !== curRun) {
      curRun = rid;
      const ntc = tcByRun[rid]?.length || 0;
      html += `<div class="runhdr">run ${esc(shortId(rid))} · ${ntc} tool calls</div>`;
    }
    const role = (m.role || "").toLowerCase();
    const kind = m.kind && m.kind !== "chat" ? `·${esc(m.kind)}` : "";
    let blocksHtml = "";
    try {
      JSON.parse(m.blocks_json).forEach((b) => {
        if (b.type === "thinking") blocksHtml += `<pre class="think">〔thinking〕${esc(b.text)}</pre>`;
        else if (b.type === "image") blocksHtml += `<pre>〔image ${esc(b.mimeType || "")}〕</pre>`;
        else if (b.type === "text") blocksHtml += `<pre>${renderBlockText(b.text)}</pre>`;
      });
    } catch { blocksHtml = `<pre>${esc(m.blocks_json)}</pre>`; }
    html += `<div class="msg"><span class="role ${role}">${esc(m.role)}${kind}</span>` +
      `<span class="seq">#${m.seq ?? "?"}</span>${blocksHtml}</div>`;
  });

  // 每个 run 的 tool calls 附在末尾（也可内联，这里集中展示便于对账）
  runIds.forEach((rid) => {
    (tcByRun[rid] || []).forEach((tc) => {
      html += toolCallHtml(rid, tc);
    });
  });

  detail.innerHTML = html;
  detail.querySelectorAll(".tc .hd").forEach((hd) =>
    hd.addEventListener("click", () => hd.parentElement.classList.toggle("open")));
}

function toolCallHtml(rid, tc) {
  const err = tc.is_error ? " err" : "";
  return `<div class="tc${err}">
    <div class="hd"><span class="nm">${tc.is_error ? "✗" : "🔧"} ${esc(tc.name)}</span>
      <span style="color:var(--dim)">${tc.duration_ms != null ? tc.duration_ms + "ms" : ""}</span>
      ${tc.error_code ? `<span style="color:var(--err)">${esc(tc.error_code)}</span>` : ""}
      <span style="color:var(--run)">${esc(shortId(rid))}</span></div>
    <div class="body">
      <div class="lbl">input:</div><pre style="margin-left:0">${esc(pretty(tc.input_summary_json))}</pre>
      <div class="lbl">output:</div><pre style="margin-left:0">${esc(pretty(tc.output_summary_json))}</pre>
    </div></div>`;
}

function pretty(json) {
  if (json == null) return "（无）";
  try { return JSON.stringify(JSON.parse(json), null, 2); } catch { return json; }
}
function shortId(s) { return s && s.length > 14 ? "…" + s.slice(-10) : s; }

// ---------- Runs ----------
function renderRuns() {
  const rows = query(`SELECT run_id, mode, trigger_json, model, provider, wire_format, status,
    parent_run_id, started_at, ended_at FROM agent_runs ORDER BY started_at DESC LIMIT 300`);
  if (!rows.length) { $("#runsBody").innerHTML = '<div class="empty">无 agent_runs</div>'; return; }
  let h = `<table class="grid"><thead><tr>
    <th>run</th><th>mode</th><th>trigger</th><th>model</th><th>wire</th><th>status</th><th>parent</th><th>started</th><th>ended</th>
    </tr></thead><tbody>`;
  rows.forEach((r) => {
    let trig = r.mode;
    try { trig = JSON.parse(r.trigger_json).kind || r.mode; } catch {}
    h += `<tr>
      <td style="color:var(--run)">${esc(shortId(r.run_id))}</td>
      <td>${esc(r.mode)}</td><td>${esc(trig)}</td>
      <td>${esc(r.model)}</td><td>${esc(r.wire_format)}</td>
      <td class="badge b-${esc(r.status)}">${esc(r.status)}</td>
      <td style="color:var(--dim)">${esc(shortId(r.parent_run_id || ""))}</td>
      <td style="color:var(--dim)">${esc(fmtTime(r.started_at))}</td>
      <td style="color:var(--dim)">${esc(fmtTime(r.ended_at))}</td></tr>`;
  });
  h += "</tbody></table>";
  $("#runsBody").innerHTML = h;
}

// ---------- SQL ----------
function runSql() {
  const sql = $("#sqlInput").value.trim();
  if (!/^\s*select/i.test(sql)) { $("#sqlOut").innerHTML = '<div class="empty" style="color:var(--err)">只允许 SELECT</div>'; return; }
  try {
    const rows = query(sql);
    if (!rows.length) { $("#sqlOut").innerHTML = '<div class="empty">0 行</div>'; return; }
    const cols = Object.keys(rows[0]);
    let h = `<table class="grid"><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>`;
    rows.forEach((r) => {
      h += "<tr>" + cols.map((c) => {
        let v = r[c]; if (v != null && typeof v === "string" && v.length > 200) v = v.slice(0, 200) + "…";
        return `<td>${esc(v)}</td>`;
      }).join("") + "</tr>";
    });
    h += `</tbody></table><div class="dim" style="margin-top:6px">${rows.length} 行</div>`;
    $("#sqlOut").innerHTML = h;
  } catch (err) { $("#sqlOut").innerHTML = `<div class="empty" style="color:var(--err)">${esc(err.message)}</div>`; }
}
$("#sqlRun").addEventListener("click", runSql);
$("#sqlInput").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") runSql(); });
</script>
</body>
</html>
